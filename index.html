    var job = ++printSeq;
    var unit = cur.unit, it = itemAt(curIndex()), n, parts;
    kind = kind && it.pages[kind] ? kind : cur.kind; n = it.pages[kind]; parts = unit.sprite ? n : 1;
    var steps = [];
    if (all) { for (var s = 1; s <= n; s++) steps.push(s); } else steps.push(cur.step);
    var urls = steps.map(function (s) { return src(it.no, kind, s); });
    var uniq = urls.filter(function (u, i) { return urls.indexOf(u) === i; });
    clearPrint(); setBusy(true);
    Promise.all(uniq.map(loadImg)).then(function (ims) {
      if (job !== printSeq) return;
      var byUrl = {};
      uniq.forEach(function (u, i) { byUrl[u] = ims[i]; });
      printArea.innerHTML = steps.map(function (s, i) {
        // ビューアと同じく，画像を 1 STEP 分の縦横比にして object-position で今の STEP の位置を見せる
        var im = byUrl[urls[i]], w = im.naturalWidth, h = im.naturalHeight / parts, k = unit.sprite ? s - 1 : 0;
        return '<div class="pp' + (w > h ? ' land' : '') + '"><img alt="" src="' + esc(urls[i]) + '" style="width:min(100%,calc(var(--ph) * ' + (w / h).toFixed(5) + '));aspect-ratio:' + w + ' / ' + h +
          ';object-position:0 ' + (parts > 1 ? k / (parts - 1) * 100 : 0) + '%"></div>';
      }).join('');
      var shown = Array.prototype.map.call(printArea.querySelectorAll('img'), function (im) { return im.decode ? im.decode().catch(function () {}) : null; });
      return Promise.all(shown).then(function () {
        if (job !== printSeq || viewer.hidden) return;
        if (isFull()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
        document.body.classList.add('printing');
        setTimeout(function () {
          if (job !== printSeq || viewer.hidden) return;
          window.print();
          setBusy(false);
        }, 60);
      });
    }).catch(function () {
      if (job !== printSeq) return;
      setBusy(false); clearPrint();
      alert('印刷する画像を読み込めませんでした。通信を確認して、もう一度おしてください。');
    });
  }
  vPrint.addEventListener('click', function () {
    if (printing) return;
    var open = vPmenu.hidden;
    setPmenu(open);
    if (open) vPmenu.querySelector('button').focus();
  });
  vPmenu.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-print]'); if (!b) return;
    setPmenu(false); vPrint.focus();
    printNow(b.getAttribute('data-print') === 'all');
  });
  document.addEventListener('click', function (e) { if (!vPmenu.hidden && !e.target.closest('.v-pwrap')) setPmenu(false); });
  // Tab でメニューの外に出たら閉じる
  vPrint.parentNode.addEventListener('focusout', function (e) { if (e.relatedTarget && !vPrint.parentNode.contains(e.relatedTarget)) setPmenu(false); });

  function hideViewer() {
    screenFull = false; setScreen(false);
    resetZoom();
    setPmenu(false); cancelPrint();
    if (isFull()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
    viewer.hidden = true;
    app.inert = false;
    document.body.classList.remove('locked');
    // 最後に見ていた番号の行に戻る
    var row = cur && app.querySelector('.item[data-no="' + cur.no + '"]');
    var target = row && (row.querySelector('.tg[data-kind="' + cur.kind + '"]') || row.querySelector('.tg'));
    if (row) row.scrollIntoView({ block: 'center' });
    var f = target || opener;
    function doFocus() { if (f && document.contains(f) && viewer.hidden) f.focus({ preventScroll: true }); }
    doFocus();
    setTimeout(doFocus, 200);
  }
  function closeViewer() {
    if (pushed) { pushed = false; try { history.back(); return; } catch (e) {} }
    hideViewer();
  }
  window.addEventListener('popstate', function () { if (!viewer.hidden) { pushed = false; hideViewer(); } });
  document.getElementById('v-close').addEventListener('click', closeViewer);
  vSteps.addEventListener('click', function (e) {
    var b = e.target.closest('.v-step'); if (!b) return;
    cur.step = +b.getAttribute('data-step'); showPage();
  });
  document.querySelectorAll('.v-kindbtn').forEach(function (b) {
    b.addEventListener('click', function () { cur.kind = b.getAttribute('data-kind'); showPage(); });
  });
  document.addEventListener('keydown', function (e) {
    if (viewer.hidden) return;
    // ビューアを開いているときの Ctrl+P は，見ている STEP を A4 1 枚で印刷する
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); setPmenu(false); printNow(false); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!vPmenu.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); setPmenu(false); vPrint.focus(); return; }
      if (vPmenu.contains(document.activeElement)) return;
    }
    var k = e.key, done = true;
    if (k === 'ArrowRight') goStep(1);
    else if (k === 'ArrowLeft') goStep(-1);
    else if (k === 'ArrowDown' || k === 'PageDown') goPrint(1, 1);
    else if (k === 'ArrowUp' || k === 'PageUp') goPrint(-1, 1);
    else if (k === ' ' || k === 'Spacebar') toggleKind();
    else if (k === 'q' || k === 'Q') { cur.kind = 'q'; showPage(); }
    else if (k === 'a' || k === 'A') { if (itemAt(curIndex()).pages.a) { cur.kind = 'a'; showPage(); } }
    else if (k === 's' || k === 'S' || k === 'f' || k === 'F') setScreen(!screenOn);
    else if (k === '+' || k === '=' || k === ';') zoomTo(zoom * 1.5);
    else if (k === '-' || k === '_') zoomTo(zoom / 1.5);
    else if (k === '0') resetZoom();
    else if (k === 'p' || k === 'P') { setPmenu(false); printNow(true, 'q'); }
    else if (k === 'Escape') { if (screenOn) setScreen(false); else if (!isFull()) closeViewer(); }
    else done = false;
    if (done) e.preventDefault();
  });

  function route() {
    if (!viewer.hidden) { pushed = false; hideViewer(); }
    var h = location.hash.replace('#', '');
    if (h === 'prints') prints();
    else if (h.indexOf('u-') === 0) unitView(h.slice(2));
    else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
